<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ქართული სიტყვების თამაში</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <h1>Სიტყვების ამრევა</h1>
        <p id="scrambledWord"></p>

        <input type="text" id="userInput" autocomplete="off" placeholder="ჩაწერეთ correcte სიტყვა">
        <button id="checkBtn">შეამოწმე</button>

        <p id="result"></p>
        <button id="nextBtn">შემდეგი სიტყვა</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
